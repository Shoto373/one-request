# Регрессия на каждом коммите в main и на каждом PR: тесты (с Postgres) и фиксированные сценарии
# через настоящий подбор без LLM с независимыми проверками снимка (python -m eval.plan_check).
name: regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: trip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d trip_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/trip_test
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: scenarios (planner + independent checks)
        run: python -m eval.plan_check --output eval/reports/plan_check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-check-report
          path: eval/reports/plan_check.json

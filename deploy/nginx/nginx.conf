# Вход на сервере: HTTP и HTTPS (самоподписанный по IP, позже Let's Encrypt), прокси на app.
# SSE (/api/sessions/*/messages, /commands) — без буферизации, иначе шаги агента придут разом в конце.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # не больше 10 сообщений агенту в секунду с IP: LLM дорогой, а SSE держит соединение
  limit_req_zone $binary_remote_addr zone=agent:10m rate=10r/s;

  # app и grafana резолвятся при запросе через DNS Docker: после выкатки у app новый IP
  # (иначе nginx держит старый и отдаёт 502), а без профиля monitoring nginx всё равно стартует
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $app http://app:8080;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location ~ ^/api/sessions/[^/]+/(messages|commands)$ {
      limit_req zone=agent burst=20 nodelay;
      proxy_pass $app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 900s;
    }

    location /grafana/ {
      set $grafana http://grafana:3000;
      proxy_pass $grafana;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass $app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location /assets/ {
      proxy_pass $app;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}
